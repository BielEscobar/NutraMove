name: nutramove-prod

x-logs: &service-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: ${BUSINESS_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *service-logs

  backend:
    image: nutramove-backend:${DEPLOY_TAG:?Set DEPLOY_TAG to the commit SHA}
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      CORS_ORIGINS: '["https://${APP_DOMAIN:?Set APP_DOMAIN}"]'
      COOKIE_SECURE: "true"
      DOCS_ENABLED: "false"
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set RATE_LIMIT_SECRET}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Sao_Paulo}
      AI_ENABLED: "false"
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.30.46.10
      - --no-access-log
    expose:
      - "8000"
    networks:
      - edge
      - data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *service-logs

  frontend:
    image: nutramove-frontend:${DEPLOY_TAG:?Set DEPLOY_TAG to the commit SHA}
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?Set API_DOMAIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *service-logs

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    networks:
      edge:
        ipv4_address: 172.30.46.10
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *service-logs

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.46.0/24
  data:
    internal: true

volumes:
  postgres_prod_data:
  caddy_prod_data:
  caddy_prod_config:
